[project]
name = "dynodino"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib==3.10.5",
    "nibabel==5.3.2",
    "nnunetv2",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pynrrd>=1.1.3",
    "requests>=2.34.2",
    "scipy==1.16.1",
    "setuptools>=84.0.0",
    "simpleitk==2.5.2",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "tqdm==4.67.1",
]

[tool.uv.workspace]
members = [
    "MedDINOv3/nnUNet",
]

[tool.uv.sources]
nnunetv2 = { workspace = true }

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
